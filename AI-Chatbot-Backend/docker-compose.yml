services:
  mysql:
    image: mysql:8.4
    container_name: ai-chatbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_chatbot
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-local_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: .
    container_name: ai-chatbot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_chatbot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
volumes:
  mysql_data: