server:
  port: 8080

spring:
  application:
    name: ai-chatbot-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: postgres
    password: "Your postgres password here"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    google:
      genai:
        api-key: "Api key inside double quote here"
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: http://localhost:5173